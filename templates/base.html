<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SmartCare{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="site-header">
    <div class="container nav">

        <a href="{{ url_for('index') }}" class="brand">
            SmartCare
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('appointment') }}">Book Appointment</a>
            <a href="{{ url_for('doctor_login') }}">Doctor Dashboard</a>
        </nav>

    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <div class="container">
        <strong>SmartCare</strong>
        <span>GNDEC Hackathon Prototype · Demo data only</span>
    </div>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
